name: release

# ریلیزِ Aether Desktop: فقط با تگ `v*` شروع می‌شود تا هیچ بیلدی بی‌دلیل
# سهمیهٔ دقیقه را نخورد. خروجی: نصب‌کنندهٔ NSIS برای x64 + چک‌سام.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-x64:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install npm dependencies
        run: npm install

      # مرحلهٔ ۲ زنجیره: psiphon-tunnel-core.exe از سورسِ تگ‌خوردهٔ بالادست
      # (همان سیاست scripts/build-psiphon.ps1 — باینری شخص‌سوم دانلود نمی‌شود).
      - name: Build psiphon-tunnel-core (x64)
        run: pwsh -NoProfile scripts/build-psiphon.ps1 -Arch x64

      # درایور Wintun از سایت رسمی، با پینِ چک‌سام (scripts/fetch-wintun.ps1).
      - name: Fetch wintun.dll
        run: pwsh -NoProfile scripts/fetch-wintun.ps1 -ArchDir bin/amd64

      # مرحلهٔ ۱ زنجیره: هستهٔ aether از سورسِ داخلِ همین مخزن (scripts/build-engine.ps1).
      - name: Build aether engine
        run: pwsh -NoProfile scripts/build-engine.ps1 -Target x86_64-pc-windows-msvc

      # دروازهٔ کوچک: اگر هر پنج فایل نیست، بیلد همین‌جا می‌شکند، نه وسطِ bundle.
      - name: Verify dist-engine is complete
        run: |
          $need = 'aether.exe', 'wintun.dll', 'psiphon-tunnel-core.exe', 'server_entries.txt', 'CORE_VERSION'
          $missing = @($need | Where-Object { -not (Test-Path "dist-engine/$_") })
          if ($missing) { throw "dist-engine incomplete: $($missing -join ', ')" }
          Get-ChildItem dist-engine | Format-Table Name, Length

      - name: Build app (NSIS)
        run: npm run tauri build

      # همان قاعدهٔ محلی: مانیفستِ requireAdministrator با mt.exe پس از لینک نهایی
      # در EXE خوابیده می‌شود (scripts/embed-manifest.ps1) و با --no-app دوباره
      # بسته‌بندی می‌شود تا نصب‌کننده EXEٔ همان را بگیرد.
      - name: Embed UAC manifest
        run: pwsh -NoProfile scripts/embed-manifest.ps1 -ExePath src-tauri/target/release/aether-desktop.exe

      - name: Re-bundle with manifest-embedded exe
        run: npx tauri build --no-app

      - name: Collect release artifacts
        run: |
          $ver = ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version)
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS installer was not produced' }
          Copy-Item $nsis.FullName "Aether-Setup-$ver-x64.exe"
          $h = (Get-FileHash "Aether-Setup-$ver-x64.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path SHA256SUMS.txt -Value "$h  Aether-Setup-$ver-x64.exe"
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-x64
          path: |
            Aether-Setup-*.exe
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/Aether-Setup-*.exe
            dist/SHA256SUMS.txt
          body_file: .github/release-notes.md
