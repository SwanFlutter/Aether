name: release

# ریلیزِ Aether Desktop — دقیقاً همان خروجی‌هایی که در README وعده داده شده‌اند:
#   Aether-Setup-<ver>-x64.exe      Inno Setup, ویندوز ۶۴بیتی
#   Aether-Setup-<ver>-x86.exe      Inno Setup, ویندوز ۳۲بیتی
#   Aether-Portable-<ver>-x64.zip   پرتابل، بدون نصب
#   Aether-Portable-<ver>-x86.zip   پرتابل، بدون نصب
#   SHA256SUMS.txt                  چک‌سام برای هر چهار فایل
#
# فقط با تگ `v*` شروع می‌شود تا هیچ بیلدی بی‌دلیل سهمیهٔ دقیقه را نخورد.
# انتشار با اسکریپتِ خودِ مخزن (scripts/publish-release-local.sh) — idempotent:
# اگر ریلیزِ تگ از پیش ساخته شده باشد، فایل‌ها با --clobber جایگزین می‌شوند.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust: x86_64-pc-windows-msvc
            wintunDir: bin/amd64
          - arch: x86
            rust: i686-pc-windows-msvc
            wintunDir: bin/x86
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install npm dependencies
        run: npm install

      # استیج ۲ زنجیره: psiphon-tunnel-core.exe از سورسِ تگ‌خوردهٔ بالادست
      # (scripts/build-psiphon.ps1 — باینری شخص‌سوم دانلود نمی‌شود).
      - name: Build psiphon-tunnel-core
        run: pwsh -NoProfile scripts/build-psiphon.ps1 -Arch ${{ matrix.arch }}

      # درایور Wintun از سایتِ رسمی، با پینِ چک‌سام (scripts/fetch-wintun.ps1).
      - name: Fetch wintun.dll
        run: pwsh -NoProfile scripts/fetch-wintun.ps1 -ArchDir ${{ matrix.wintunDir }}

      # استیج ۱ زنجیره: هستهٔ aether از سورسِ داخلِ همین مخزن (scripts/build-engine.ps1).
      - name: Build aether engine
        run: pwsh -NoProfile scripts/build-engine.ps1 -Target ${{ matrix.rust }}

      # دروازهٔ کوچک: اگر هر پنج فایل نیست، بیلد همین‌جا می‌شکند، نه وسطِ bundle.
      - name: Verify dist-engine is complete
        run: |
          $need = 'aether.exe', 'wintun.dll', 'psiphon-tunnel-core.exe', 'server_entries.txt', 'CORE_VERSION'
          $missing = @($need | Where-Object { -not (Test-Path "dist-engine/$_") })
          if ($missing) { throw "dist-engine incomplete: $($missing -join ', ')" }
          Get-ChildItem dist-engine | Format-Table Name, Length

      # بدون bundle: فقط خودِ اجرایی؛ بسته‌بندی را Inno و پرتابل می‌سازند.
      - name: Build app (no bundle)
        run: npx tauri build --bundles none --target ${{ matrix.rust }}

      # همان قاعدهٔ محلی: مانیفستِ requireAdministrator با mt.exe پس از لینک نهایی
      # در EXE خوابیده می‌شود (scripts/embed-manifest.ps1).
      - name: Embed UAC manifest
        run: pwsh -NoProfile scripts/embed-manifest.ps1 -ExePath "src-tauri/target/${{ matrix.rust }}/release/aether-desktop.exe"

      - name: Stage payload
        run: pwsh -NoProfile scripts/stage-payload.ps1 -Target ${{ matrix.rust }} -Arch ${{ matrix.arch }}

      - name: Inno Setup
        uses: MinhaoWang/iscc@v0.9.0

      - name: Compile installer
        run: |
          $ver = ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version)
          iscc /DMyyAppVersion="$ver" /DMyArch="${{ matrix.arch }}" /DPayloadDir="dist\payload-${{ matrix.arch }}" /DOutputDir="dist" installer\aether.iss
          if ($LASTEXITCODE -ne 0) { throw 'iscc failed' }

      - name: Build portable
        run: |
          $ver = ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version)
          pwsh -NoProfile scripts/make-portable.ps1 -Arch ${{ matrix.arch }} -Version $ver

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.arch }}
          path: |
            dist/Aether-Setup-*-${{ matrix.arch }}.exe
            dist/Aether-Portable-*-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # همان اسکریپتِ انتشارِ محلی: چک‌سام + انتشارِ idempotent با gh
      # (اگر ریلیزِ تگ از قبل ساخته شده باشد، فایل‌ها --clobber می‌شوند).
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release-local.sh dist --tag "${GITHUB_REF_NAME}"

      # اگر ریلیزیِ پیش از این فایلِ اضافی (مثلاً «(1)» پسوند) گذاشته باشد،
      # فقط چهار فایلِ موجه + چک‌سام بماند.
      - name: Remove stray duplicate assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == "'"${GITHUB_REF_NAME}"'") | .assets[] | select(.name | test("\\(")) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              done
